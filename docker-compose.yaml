# Secrets come from ./.env: ASSET_SECRET, POSTGRES_PASSWORD and the VLM API key used in
# inference/models.yaml (e.g. DEEPSEEK_API_KEY).
services:
  web:
    build: ./web
    ports: ["3000:3000"]
    environment:
      SITE_URL: ${SITE_URL:-http://localhost:3000} # Where visitors reach the site, as share cards link it
    depends_on: [server]

  server:
    build: ./server
    ports: ["8080:8080"]
    environment:
      ASSET_SECRET: ${ASSET_SECRET:?set ASSET_SECRET in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./server/config.docker.yaml:/etc/memedb/config.yaml:ro
      - assets:/data/assets
    depends_on:
      db:
        condition: service_healthy
      inference:
        condition: service_started

  db:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_DB: memedb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db:/var/lib/postgresql
      - ./server/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "memedb"]
      interval: 2s
      retries: 30

  # Without a GPU, remove deploy: the models then run on the CPU (see inference/models.yaml); TORCH=cpu in .env makes
  # a smaller image.
  inference:
    build:
      context: ./inference
      args:
        TORCH: ${TORCH:-cuda}
    env_file: .env
    volumes:
      - models:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  assets:
  db:
  models:
