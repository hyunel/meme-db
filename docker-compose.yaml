# Inference reads VLM settings and download mirrors from .env.
services:
  web:
    image: ghcr.io/hyunel/meme-db/web:latest
    build:
      context: ./web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    ports: ["3000:3000"]
    environment:
      SITE_URL: ${SITE_URL:-http://localhost:3000} # Where visitors reach the site, as share cards link it
    depends_on: [server]

  server:
    image: ghcr.io/hyunel/meme-db/server:latest
    build: ./server
    volumes:
      - ./server/config.docker.yaml:/etc/memedb/config.yaml:ro
      - assets:/data/assets
    depends_on:
      db:
        condition: service_healthy
      inference:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_DB: memedb
      POSTGRES_PASSWORD: postgres
    volumes:
      - db:/var/lib/postgresql
      - ./server/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "memedb"]
      interval: 2s
      retries: 30

  # Runs on the CPU unless .env adds docker-compose.cuda.yaml or docker-compose.xpu.yaml.
  inference:
    image: ghcr.io/hyunel/meme-db/inference:latest
    build:
      context: ./inference
      args:
        BASE_IMAGE: ${INFERENCE_BASE_IMAGE:-ghcr.io/astral-sh/uv:python3.12-trixie-slim}
    env_file: .env
    environment:
      TORCH: cpu
    volumes:
      - ./inference/models.yaml:/app/models.yaml:ro
      - cache:/cache
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 50051), timeout=3).close()"]
      interval: 10s
      timeout: 5s
      start_period: 30m # First boot may download dependencies and model weights
      retries: 3

volumes:
  assets:
  db:
  cache:
