[project]
name = "memedb-inference"
version = "0.1.0"
description = "MemeDB inference service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "av>=16.0.1",
    "cairosvg>=2.8.2",
    "grpcio>=1.76.0",
    "llguidance>=1.4.0",
    "lottie>=0.7.2",
    "openai>=2.13.0",
    "outlines==1.2.*",
    "pillow>=12.0.0",
    "protobuf>=6.33.2",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "transformers>=4.57.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
