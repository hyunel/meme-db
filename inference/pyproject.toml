[project]
name = "memedb-inference"
version = "0.1.0"
description = "MemeDB inference service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "av>=19.0.2",
    "grpcio>=1.84.0",
    "llguidance>=1.9.1",
    "nvidia-ml-py>=13",
    "openai>=3.35.1",
    "outlines==1.3.*",
    "pillow>=13.0.0",
    "protobuf>=7.36.2",
    "psutil>=7.2.2",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "rlottie-python>=1.3.8",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.2",
]

[project.optional-dependencies]
# PyTorch for each backend: CUDA's from the default index, the others from PyTorch's.
cuda = ["torch", "torchvision"]
cpu = ["torch", "torchvision"]
# triton-xpu runs torch.compile, from the same index as torch; pyzes reads the GPU's utilization
xpu = ["torch", "torchvision", "triton-xpu", "pyzes"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }, { extra = "xpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-xpu", extra = "xpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-xpu", extra = "xpu" },
]
triton-xpu = { index = "pytorch-xpu", extra = "xpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
