[project]
name = "memedb-inference"
version = "0.1.0"
description = "MemeDB inference service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "av>=16.0.1",
    "grpcio>=1.76.0",
    "llguidance>=1.4.0",
    "nvidia-ml-py>=12",
    "openai>=2.13.0",
    "outlines==1.2.*",
    "pillow>=12.0.0",
    "protobuf>=6.33.2",
    "psutil>=7",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "rlottie-python>=1.3.8",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=4.57.3",
]

[project.optional-dependencies]
# The torch build, picked by the Docker image: the default from PyPI ships the CUDA libraries, cpu leaves them out.
# uv resolves the two apart only as conflicting extras.
cuda = ["torch", "torchvision"]
cpu = ["torch", "torchvision"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = { index = "pytorch-cpu", extra = "cpu" }
torchvision = { index = "pytorch-cpu", extra = "cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
