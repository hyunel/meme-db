[project]
name = "memedb-inference"
version = "0.1.0"
description = "MemeDB inference service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "av>=16.0.1",
    "grpcio>=1.76.0",
    "llguidance>=1.4.0",
    "nvidia-ml-py>=12",
    "openai>=2.13.0",
    "outlines==1.2.*",
    "pillow>=12.0.0",
    "protobuf>=6.33.2",
    "psutil>=7",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "rlottie-python>=1.3.8",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=4.57.3",
]

[project.optional-dependencies]
# PyTorch for each backend: CUDA's from the default index, the others from PyTorch's.
cuda = ["torch", "torchvision"]
cpu = ["torch", "torchvision"]
xpu = ["torch", "torchvision", "triton-xpu"]  # torch.compile's, from the same index as torch

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }, { extra = "xpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-xpu", extra = "xpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-xpu", extra = "xpu" },
]
triton-xpu = { index = "pytorch-xpu", extra = "xpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
