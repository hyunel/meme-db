name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: server
          - image: web
          - image: inference
            build-args: TORCH=cuda
          - image: inference
            build-args: TORCH=cpu
            suffix: -cpu
    steps:
      - uses: actions/checkout@v7

      # The CUDA image outgrows the runner's free disk
      - if: matrix.image == 'inference'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          flavor: suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The notes are the feat, fix and perf commits since the previous tag, which are written as a changelog.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          image=ghcr.io/$GITHUB_REPOSITORY
          prev=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          {
            echo "## Images"
            echo
            for name in server web inference; do echo "- \`$image/$name:${tag#v}\`"; done
            echo "- \`$image/inference:${tag#v}-cpu\`, without CUDA"
            echo
            echo "## Changes"
            echo
            # Bullets wrapped at 72 columns are joined, as releases render line breaks
            git log --no-merges -E --grep='^(feat|fix|perf)' --format='### %s%n%n%b' "${prev:+$prev..}$tag" | sed -z 's/\n  / /g'
          } > notes.md
          gh release create "$tag" --title "$tag" --notes-file notes.md $([[ $tag == *-* ]] && echo --prerelease)
