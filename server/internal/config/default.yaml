server:
  port: 8080

storage:
  backend: local      # local, or s3 for an S3-compatible object store such as:
  local:
    path: "./assets"
  # s3:
  #   endpoint: "https://s3.oss-cn-hangzhou.aliyuncs.com"   # On AWS, https://s3.<region>.amazonaws.com
  #   region: "cn-hangzhou"
  #   bucket: "memedb"
  #   access_key_id: "${S3_ACCESS_KEY_ID}"
  #   secret_access_key: "${S3_SECRET_ACCESS_KEY}"
  #   path_style: false   # Only for self-hosted stores without wildcard DNS

auth:
  session_ttl: 720h   # A web sign-in lapses after this long unused

database:
  url: "postgres://postgres:postgres@localhost:5432/postgres"

inference:
  grpc_addr: "localhost:50051"

worker:
  concurrency: 8      # Tasks in flight; keep >= inference vlm concurrency/batch size so batches fill up
  poll_interval: 5s   # Fallback wake-up for due retries and expired leases

# Similarities compare embeddings of spellings under prompt.tag; retune them after changing that prompt, prompt.language or the embedding model.
tags:
  merge_similarity: 0.92    # A new spelling joins its most similar tag at or above this, else it starts a new tag
  suggest_similarity: 0.8   # Tags this similar on average are suggested to admins as duplicates
  min_usage: 2              # Tags on fewer memes stay off hot lists and meme cards
  common_share: 0.3         # Tags on a larger share of memes are flagged as candidates to hide

# Each makes a task of its type on its cron, but not while its last is unfinished; without a cron, only when run from
# the admin console. A list in config.yaml replaces this one.
tasks:
  - name: refresh_tags
    type: refresh_tags    # Recounts tag usage for hot lists and meme cards, and finds duplicates
    cron: "0 * * * *"
  - name: purge_logs
    type: purge_logs
    params:
      retention: 720h     # Stored logs older than this are deleted
  - name: purge_tasks
    type: purge_tasks
    params:
      retention: 720h     # Finished tasks older than this are deleted, a batch once all of it is

# A search recalls every page at once and reranks a page when it is fetched; its pages are kept in memory meanwhile.
search:
  max_pages: 10       # Keep max_pages × the largest recall limit well under hnsw.max_scan_tuples (20000)
  session_ttl: 15m    # An expired search is run again from the page asked for
  max_sessions: 2000  # Up to some 50 KB each
  recall_limits:      # Hits per page of each channel
    metaphor: 15
    semantic: 10
    clip_text: 15
    ocr: 10
    clip_image: 50

# Similar memes keep no state: page p recalls p + 2 pages deep, to tell whether another page follows.
similar:
  max_pages: 10
  recall_limit: 10    # Hits per page of each vector channel

prompt:
  language: "Simplified Chinese"   # Fills {language} in caption: titles, summaries and tags users see; the search fields stay English
  retrieval: "Given user query keywords, retrieve the most relevant paragraphs"
  tag: "Given a meme tag, retrieve tags with the same meaning"
  caption: |
    You catalog memes for a meme search engine. Analyze the image and return one JSON object with these fields, in this order:
    {"ocr_text": ..., "description": ..., "meaning": ..., "queries": [...], "title": ..., "summary": ..., "tags": [...]}
    Inside string values, quote with “ ” or 「 」 rather than straight double quotes.
    If the image is several frames stitched together and labelled "Key Frame", it is an animation: treat the frames as one meme.

    First, for the search engine, in English whatever language the image text is in:
    - "ocr_text": all meaningful text in the image, verbatim in its original language, keeping line breaks. Skip watermarks, user handles, repeated background text and Key Frame labels. null if there is none.
    - "description": one or two plain English sentences on what is shown: who or what (name the people, characters, logos and meme templates you recognize, telling look-alikes apart: Cheems is not Doge), expression and action, notable props or clothing, layout of image and text. No interpretation, no image quality.
    - "meaning": one or two English sentences on the emotion, attitude or joke the meme conveys and the situations people send it in. When the joke rests on wordplay, a quote or a cultural reference, explain it.
    - "queries": 6 to 10 search terms of one to three words that people would type to find this meme: the emotions and attitudes it shows, what is happening, the chat situations it answers, and its catchphrase or meme name. For example, a cat hiding under a blanket might get: hiding, scared, nope, under blanket, anxious, do not disturb. In English, plus at most 2 in the language of the image text when that is not English. Never include words meaning "meme", "sticker" or "reaction image" in any language.

    Then, for users, in {language}:
    - "title": a short name for the meme, like a file name: its catchphrase or meme name when it has one, otherwise its subject and mood.
    - "summary": one or two sentences telling a user what the meme expresses and when to send it.
    - "tags": 3 to 6 tags for browsing the collection.

    A tag is a category that would fit many other memes too. Choose them from these kinds:
    - Source: the people, characters, works and meme templates shown, e.g. Lu Xun, Pepe the Frog, Panda Head. Name each one you recognize, a character by full name together with its work; leave out only the ones you would be guessing.
    - Subject: what the meme shows, e.g. Shiba Inu, cat, anime girl.
    - Topic: what it is about, when it is about something, e.g. work, gaming, Linux, politics.
    - Emotion or attitude: what it conveys, e.g. sarcasm, happy, speechless, scared.
    - Style: only when the whole image is drawn in a distinctive style, e.g. pixel art, manga, 3D render.
    Every tag must be true of this image and add something the others don't (not both "anime" and "anime girl"). Write each one the way {language} speakers usually call it, in the shortest common form, keeping a name in its original form when that is how they know it.
    Never tag objects, actions, catchphrases or quotes particular to this image (they belong in the title and description), appearance details (hair or eye color, hairstyle, blushing), words true of almost every meme (meme, sticker, funny, silly), or production details (cutout, white background, low resolution, the language of the text).

upload:
  max_size_mb: 1.0
  allowed_types:
    - "image/*"
    - "video/*,.webm,.mp4"
    - "application/x-gzip,.tgs"
    - "application/json,.json,.lottie"