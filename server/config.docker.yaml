# Server config for docker-compose; ${VAR} placeholders come from the environment.
server:
  asset_secret: "${ASSET_SECRET}"  # Signs file links: changing it breaks every link handed out
  storage_path: "/data/assets"

database:
  url: "postgres://postgres:${POSTGRES_PASSWORD}@db:5432/memedb"

inference:
  grpc_addr: "inference:50051"
