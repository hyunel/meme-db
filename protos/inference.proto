syntax = "proto3";

package inference;

option go_package = "github.com/hyunel/MemeDB/server/internal/pb";

service InferenceService {
  // Batch text embedding using Qwen
  rpc TextEmbedding (TextEmbeddingRequest) returns (TextEmbeddingResponse);

  // Batch image embedding using CLIP
  rpc ClipImageEmbedding (ClipImageEmbeddingRequest) returns (ClipImageEmbeddingResponse);

  // Batch text embedding using CLIP
  rpc ClipTextEmbedding (ClipTextEmbeddingRequest) returns (ClipTextEmbeddingResponse);

  // Rerank text pairs using Qwen
  rpc Rerank (RerankRequest) returns (RerankResponse);

  // Caption image using VLM
  rpc ImageCaption (ImageCaptionRequest) returns (ImageCaptionResponse);
}

message Image {
  bytes data = 1;
  string file_format = 2;
}

message Embedding {
  repeated float values = 1;
}

message TextEmbeddingRequest {
  string task_description = 1;
  repeated string texts = 2;
}

message TextEmbeddingResponse {
  repeated Embedding embeddings = 1;
}

message ClipImageEmbeddingRequest {
  repeated Image images = 1;
}

message ClipImageEmbeddingResponse {
  repeated Embedding embeddings = 1;
}

message ClipTextEmbeddingRequest {
  repeated string texts = 1;
}

message ClipTextEmbeddingResponse {
  repeated Embedding embeddings = 1;
}

message RerankPair {
  string query = 1;
  string document = 2;
}

message RerankRequest {
  string task_description = 1;
  repeated RerankPair pairs = 2;
}

message RerankResponse {
  repeated float scores = 1;
}

message ImageCaptionRequest {
  string prompt = 1;
  repeated Image images = 2;
}

message ImageCaptionResult {
  string caption = 1;
  int32 width = 2;
  int32 height = 3;
  Embedding clip_embedding = 4;
}

message ImageCaptionResponse {
  repeated ImageCaptionResult results = 1;
}
